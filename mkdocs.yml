site_name: Pratheep Srikones

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Asgardeo CLI: Asgardeo_CLI.md

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
